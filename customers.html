<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>العملاء - MIZAN ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>MIZAN ERP | مِيزَان</h1>
  <p>حيث تتزن تجارتك</p>

  <div class="card">
    <h2>قائمة العملاء</h2>
    
    <p>اسم العميل:</p>
    <input id="customerName" type="text" placeholder="مثال: أحمد محمد" style="width:90%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc;">
    
    <p>رقم الهاتف:</p>
    <input id="customerPhone" type="text" placeholder="مثال: 777123456" style="width:90%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc;">
    
    <p>الدين عليه:</p>
    <input id="customerDebt" type="number" placeholder="مثال: 50000" style="width:90%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc;">
    
    <br><br>
    <button onclick="addCustomer()" style="padding:12px 25px; font-size:18px; background:#0f2a4a; color:white; border:none; border-radius:8px; cursor:pointer; width:95%;">إضافة عميل</button>
    
    <hr>
    <div id="customerList" style="text-align:right;">
      <p>لا يوجد عملاء بعد</p>
    </div>
    
    <br>
    <a href="dashboard.html" style="color:#0f2a4a;">العودة للوحة التحكم</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
