<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>المنتجات - MIZAN ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>MIZAN ERP | مِيزَان</h1>
  <p>حيث تتزن تجارتك</p>

  <div class="card">
    <h2>قائمة المنتجات</h2>
    
    <p>اسم المنتج:</p>
    <input id="productName" type="text" placeholder="مثال: أرز بسمتي" style="width:90%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc;">
    
    <p>السعر:</p>
    <input id="productPrice" type="number" placeholder="مثال: 10000" style="width:90%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc;">
    
    <p>الكمية:</p>
    <input id="productQty" type="number" placeholder="مثال: 50" style="width:90%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc;">
    
    <br><br>
    <button onclick="addProduct()" style="padding:12px 25px; font-size:18px; background:#0f2a4a; color:white; border:none; border-radius:8px; cursor:pointer; width:95%;">إضافة منتج</button>
    
    <hr>
    <div id="productList" style="text-align:right;">
      <p>لا يوجد منتجات بعد</p>
    </div>
    
    <br>
    <a href="dashboard.html" style="color:#0f2a4a;">العودة للوحة التحكم</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
