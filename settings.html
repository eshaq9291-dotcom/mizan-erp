<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الإعدادات - MIZAN ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>MIZAN ERP | مِيزَان</h1>
  <p>حيث تتزن تجارتك</p>

  <div class="card">
    <h2>إعدادات الشركة والمستخدمين</h2>
    
    <p>اسم الشركة:</p>
    <input id="companyName" type="text" value="شركة الميزاني للتجارة" style="width:90%; padding:12px; font-size:16px; border-radius:8px;">
    
    <p>العملة الأساسية:</p>
    <select id="companyCurrency" style="width:95%; padding:12px; font-size:16px; border-radius:8px;">
      <option>ريال يمني - YER</option>
      <option>ريال سعودي - SAR</option>
      <option>دولار أمريكي - USD</option>
    </select>
    
    <hr>
    <h3>إضافة مستخدم جديد</h3>
    
    <p>اسم المستخدم:</p>
    <input id="newUserName" type="text" placeholder="مثال: محمد الكاشير" style="width:90%; padding:12px; font-size:16px; border-radius:8px;">
    
    <p>صلاحية المستخدم:</p>
    <select id="newUserRole" style="width:95%; padding:12px; font-size:16px; border-radius:8px;">
      <option value="مدير">مدير - يستطيع كل شيء</option>
      <option value="كاشير">كاشير - بيع فقط</option>
      <option value="محاسب">محاسب - تقارير ومصاريف فقط</option>
      <option value="مشاهد">مشاهد - عرض فقط بدون تعديل</option>
    </select>
    
    <br><br>
    <button onclick="addUser()" style="padding:12px 25px; font-size:18px; background:#0f2a4a; color:white; border:none; border-radius:8px; cursor:pointer; width:95%;">إضافة مستخدم</button>
    <br><br>
    <button onclick="saveSettings()" style="padding:12px 25px; font-size:18px; background:#c9a227; color:#0f2a4a; border:none; border-radius:8px; cursor:pointer; width:95%; font-weight:bold;">حفظ إعدادات الشركة</button>
    
    <hr>
    <div id="userList" style="text-align:right;">
      <p>المستخدمون الحاليون:</p>
      <p>👤 المدير العام - مدير</p>
    </div>
    
    <br>
    <a href="dashboard.html" style="color:#0f2a4a;">العودة للوحة التحكم</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
