<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - MIZAN ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>MIZAN ERP | مِيزَان</h1>
  <p>حيث تتزن تجارتك</p>

  <div class="card">
    <h2>تسجيل الدخول</h2>
    
    <p>الإيميل:</p>
    <input id="email" type="email" placeholder="اكتب إيميلك هنا" style="width:90%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc;">
    
    <p>كلمة المرور:</p>
    <input id="password" type="password" placeholder="اكتب كلمة المرور" style="width:90%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc;">
    
    <br><br>
    <button onclick="login()" style="padding:12px 25px; font-size:18px; background:#0f2a4a; color:white; border:none; border-radius:8px; cursor:pointer; width:95%;">دخول</button>
    
    <p id="loginResult" style="color:red;"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
